name: collect-odds
on:
  schedule:
    - cron: '45 22 * * *'   # 07:45 JST -> runs until 13:30
    - cron: '15 4 * * *'    # 13:15 JST -> runs until 19:00
    - cron: '45 9 * * *'    # 18:45 JST -> runs until 22:00
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: collect-${{ github.run_id }}
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - name: connectivity check (manual runs only)
        if: github.event_name == 'workflow_dispatch'
        run: |
          python3 -c "
          import collector as C, datetime
          hd = datetime.datetime.now(C.JST).strftime('%Y%m%d'); v = C.venues(hd); print('venues', v)
          if v:
              dl = C.deadlines(v[0], hd); print('deadlines', dl)
              w, t = C.snapshot(v[0], 12, hd); print('win odds 12R', w, 'tri count', sum(x is not None for x in t.values()))
              print('result', C.result(v[0], 12, hd))
          "
      - name: pick window end
        id: w
        run: |
          H=$(TZ=Asia/Tokyo date +%H)
          if [ "$H" -lt 13 ]; then echo "until=13:35" >> $GITHUB_OUTPUT
          elif [ "$H" -lt 18 ]; then echo "until=19:05" >> $GITHUB_OUTPUT
          else echo "until=22:00" >> $GITHUB_OUTPUT; fi
      - name: collect (commits every 20 minutes)
        run: |
          git config user.name "odds-bot"; git config user.email "odds-bot@users.noreply.github.com"
          python3 collector.py --until ${{ steps.w.outputs.until }} &
          PID=$!
          n=0
          while kill -0 $PID 2>/dev/null; do
            sleep 30; n=$((n+1))
            [ $((n % 40)) -eq 0 ] || continue
            git add boatrace_data 2>/dev/null && git commit -qm "odds $(TZ=Asia/Tokyo date +%m%d-%H%M)" && git pull -q --rebase --autostash && git push -q || true
          done
      - name: final commit
        if: always()
        run: |
          git add boatrace_data 2>/dev/null && git commit -qm "odds $(TZ=Asia/Tokyo date +%m%d-%H%M) final" || exit 0
          for i in 1 2 3; do git pull -q --rebase --autostash && git push -q && break; sleep 5; done
