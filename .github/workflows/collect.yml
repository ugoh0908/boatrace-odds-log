name: collect-odds
# Runs continuously: each run records for ~5.5 hours, then starts the next run itself.
# The hourly schedule is only a backup that restarts the chain if it ever breaks.
on:
  schedule:
    - cron: '7 * * * *'
  workflow_dispatch:
permissions:
  contents: write
  actions: write
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: skip if another run is already recording
        id: chk
        run: |
          n=$(gh run list --workflow collect.yml --status in_progress --json databaseId -q "[.[]|select(.databaseId != ${{ github.run_id }})]|length")
          echo "others=$n"; echo "others=$n" >> $GITHUB_OUTPUT
      - name: connectivity check (manual runs only)
        if: github.event_name == 'workflow_dispatch' && steps.chk.outputs.others == '0'
        run: |
          python3 -c "
          import collector as C, datetime
          hd = datetime.datetime.now(C.JST).strftime('%Y%m%d'); v = C.venues(hd); print('venues', v)
          "
      - name: collect for 330 minutes (commits every 20 minutes)
        if: steps.chk.outputs.others == '0'
        run: |
          git config user.name "odds-bot"; git config user.email "odds-bot@users.noreply.github.com"
          END=$(( $(date +%s) + 330*60 ))
          python3 collector.py --minutes 330 &
          PID=$!
          n=0
          while [ $(date +%s) -lt $END ]; do
            sleep 30; n=$((n+1))
            [ $((n % 40)) -eq 0 ] || continue
            git add boatrace_data 2>/dev/null && git commit -qm "odds $(TZ=Asia/Tokyo date +%m%d-%H%M)" && git pull -q --rebase --autostash && git push -q || true
          done
          kill $PID 2>/dev/null || true
      - name: final commit
        if: always() && steps.chk.outputs.others == '0'
        run: |
          git add boatrace_data 2>/dev/null && git commit -qm "odds $(TZ=Asia/Tokyo date +%m%d-%H%M) final" || true
          for i in 1 2 3; do git pull -q --rebase --autostash && git push -q && break; sleep 5; done
      - name: start the next run
        if: always() && steps.chk.outputs.others == '0'
        run: gh workflow run collect.yml --ref main
